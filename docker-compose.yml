services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: podcast
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: podcast_bot
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U podcast -d podcast_bot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  bot:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://podcast:secret@db:5432/podcast_bot

  web:
    build: .
    env_file: .env
    command: ["uv", "run", "uvicorn", "web_main:app", "--host", "0.0.0.0", "--port", "8888", "--workers", "1"]
    ports:
      - "8888:8888"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://podcast:secret@db:5432/podcast_bot

volumes:
  pgdata:
